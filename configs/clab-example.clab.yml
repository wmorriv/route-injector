# Example Containerlab topology with route-tool
#
# Build the image first:  docker build -t route-tool:latest .
# Deploy:                 sudo clab deploy -t configs/clab-example.clab.yml
# Check status:           sudo clab inspect -t configs/clab-example.clab.yml
# Destroy:                sudo clab destroy -t configs/clab-example.clab.yml
#
# After deploy, check BGP status:
#   docker exec -it clab-bgp-scale-test-route-injector \
#     env exabgp.api.pipename=/run/exabgp/exabgp exabgpcli show neighbor summary

name: bgp-scale-test

topology:
  nodes:
    # --- Device Under Test ---
    dut:
      kind: ceos
      image: ceos:4.35.0F
      startup-config: |
        hostname dut
        !
        interface Ethernet1
          no switchport
          ip address 10.0.0.1/24
        !
        router bgp 65000
          router-id 10.0.0.1
          neighbor 10.0.0.2 remote-as 65001

    # --- Route Injector ---
    route-injector:
      kind: linux
      image: route-tool:latest
      binds:
        - clab-config.yaml:/config/config.yaml:ro
      env:
        STARTUP_DELAY: "5"
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["route-injector:eth1", "dut:eth1"]
