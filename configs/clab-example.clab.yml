# Example Containerlab topology with route-tool
#
# Build the image first:  docker build -t route-tool:latest .
# Deploy:                 sudo clab deploy -t configs/clab-example.clab.yml
# Check status:           sudo clab inspect -t configs/clab-example.clab.yml
# Destroy:                sudo clab destroy -t configs/clab-example.clab.yml
#
# After deploy, check BGP status:
#   docker exec -it clab-bgp-scale-test-route-injector \
#     env exabgp.api.pipename=/run/exabgp/exabgp exabgpcli show neighbor summary

name: bgp-scale-test

topology:
  nodes:
    # --- Device Under Test ---
    # Replace with your router image (ceos, srlinux, crpd, vr-sros, etc.)
    dut:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      startup-config: |
        set / network-instance default
        set / interface ethernet-1/1 admin-state enable
        set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
        set / interface ethernet-1/1 subinterface 0 ipv4 address 10.0.0.1/24
        set / network-instance default interface ethernet-1/1.0
        set / network-instance default protocols bgp admin-state enable
        set / network-instance default protocols bgp autonomous-system 65000
        set / network-instance default protocols bgp router-id 10.0.0.1
        set / network-instance default protocols bgp group route-tool
        set / network-instance default protocols bgp group route-tool peer-as 65001
        set / network-instance default protocols bgp neighbor 10.0.0.2
        set / network-instance default protocols bgp neighbor 10.0.0.2 peer-group route-tool

    # --- Route Injector ---
    route-injector:
      kind: linux
      image: route-tool:latest
      binds:
        - clab-config.yaml:/config/config.yaml:ro
      env:
        STARTUP_DELAY: "5"
      exec:
        - ip addr add 10.0.0.2/24 dev eth1
        - ip link set eth1 up

  links:
    - endpoints: ["route-injector:eth1", "dut:e1-1"]
